name: Verify published demo
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-published-demo
  cancel-in-progress: false
jobs:
  public-downloads:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Prepare isolated browser verification
        shell: pwsh
        run: |
          npm install --no-audit --no-fund --ignore-scripts --package-lock=false @playwright/test@1.61.0
          if ($LASTEXITCODE -ne 0) { throw 'Browser dependency installation failed' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed' }
      - name: Download public archives anonymously and verify every full checksum
        shell: pwsh
        run: |
          @'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {createWriteStream} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {Transform,Readable,Writable} from 'node:stream';
          import {pipeline} from 'node:stream/promises';
          import assert from 'node:assert/strict';
          const directory=path.resolve('.tmp/player-download-publication');
          await fs.mkdir(directory,{recursive:true});
          const apiResponse=await fetch('https://api.github.com/repos/TonyG-FWE/evidence-quest/releases/tags/demo-10b6249d3cad',{credentials:'omit',headers:{'User-Agent':'Evidence-Quest-public-download-verification'}});
          assert.equal(apiResponse.status,200);
          const release=await apiResponse.json();
          await fs.writeFile(path.join(directory,'release.json'),JSON.stringify(release,null,2)+'\n');
          assert.equal(release.tag_name,'demo-10b6249d3cad');assert.equal(release.draft,false);
          const get=async url=>{const response=await fetch(url,{credentials:'omit',headers:{'User-Agent':'Evidence-Quest-public-download-verification'}});assert.ok(response.ok,`${response.status}: ${url}`);return response;};
          const page=await get(release.html_url);assert.match(await page.text(),/Evidence Quest portable demo/);
          const targets=['win32-x64','darwin-x64','darwin-arm64','linux-x64'];
          const progress=new Map();
          setInterval(()=>console.log(JSON.stringify({status:'DOWNLOADING',bytes:Object.fromEntries(progress)})),30000).unref();
          const downloads=await Promise.all(targets.map(async target=>{
           const extension=target==='win32-x64'?'.zip':'.tar.gz';
           const name=`evidence-quest-${target}-10b6249d3cad${extension}`;
           const asset=release.assets.find(x=>x.name===name),sidecar=release.assets.find(x=>x.name===name+'.sha256');assert.ok(asset&&sidecar,target);
           const checksum=(await (await get(sidecar.browser_download_url)).text()).trim();
           const match=checksum.match(/^([a-f0-9]{64})  (.+)$/);assert.ok(match,checksum);assert.equal(match[2],name);
           await fs.writeFile(path.join(directory,name+'.sha256'),checksum+'\n');
           const file=path.join(directory,name);const hash=createHash('sha256');let bytes=0;
           const response=await get(asset.browser_download_url);
           const meter=new Transform({transform(chunk,encoding,callback){bytes+=chunk.length;progress.set(target,bytes);hash.update(chunk);callback(null,chunk);}});
           await pipeline(Readable.fromWeb(response.body),meter,target==='win32-x64'?createWriteStream(file,{flags:'wx'}):new Writable({write(chunk,encoding,callback){callback();}}));
           const sha256=hash.digest('hex');assert.equal(sha256,match[1],name);assert.equal(bytes,asset.size,name);assert.ok(bytes<2*1024**3);
           if(asset.digest)assert.equal(asset.digest,'sha256:'+sha256);
           const testAsset=release.assets.find(x=>x.name===`test-${target}.json`);assert.ok(testAsset);
           const nativeTest=await (await get(testAsset.browser_download_url)).json();assert.equal(nativeTest.status,'PASS');assert.equal(nativeTest.target,target);assert.equal(nativeTest.checks.length,8);assert.equal(nativeTest.archiveSha256,sha256);assert.equal(nativeTest.commit,'10b6249d3cade77798d5a2c7f233d52c35a4ad41');
           await fs.writeFile(path.join(directory,`native-test-${target}.json`),JSON.stringify(nativeTest,null,2)+'\n');
           const record={target,name,url:asset.browser_download_url,bytes,sha256,githubDigest:asset.digest??null,checksumUrl:sidecar.browser_download_url,signedOutDownload:true,nativeChecks:nativeTest.checks,limits:nativeTest.limits};
           await fs.writeFile(path.join(directory,`download-${target}.json`),JSON.stringify(record,null,2)+'\n');
           console.log(JSON.stringify({status:'DOWNLOADED_AND_VERIFIED',target,bytes,sha256}));return record;
          }));
          const result={status:'PASS',at:new Date().toISOString(),release:release.html_url,tag:release.tag_name,commit:'10b6249d3cade77798d5a2c7f233d52c35a4ad41',verificationHost:'Fresh windows-2022 GitHub-hosted runner; complete public archive bodies streamed and hashed, Windows archive retained for extraction.',authentication:'No cookies, Authorization header, GitHub token or browser session supplied to any release-page, archive, checksum or test-report request.',downloads};
          await fs.writeFile(path.join(directory,'downloads.json'),JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify({status:'PASS',archives:downloads.length}));
          '@ | Set-Content -LiteralPath verify-downloads.mjs
          node verify-downloads.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Public archive verification failed' }
      - name: Verify downloaded Windows package offline and signed-out release page
        shell: pwsh
        run: |
          @'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {spawn} from 'node:child_process';
          import {once} from 'node:events';
          import assert from 'node:assert/strict';
          import {chromium,expect} from '@playwright/test';
          const directory=path.resolve('.tmp/player-download-publication');
          const download=JSON.parse(await fs.readFile(path.join(directory,'download-win32-x64.json'),'utf8'));
          async function run(command,args,options={}){return await new Promise((resolve,reject)=>{const process=spawn(command,args,{windowsHide:true,...options});let output='';process.stdout?.on('data',data=>output+=data);process.stderr?.on('data',data=>output+=data);process.on('error',reject);process.on('close',code=>resolve({code,output}));});}
          const extraction=await fs.mkdtemp(path.resolve('.tmp/Published game '));
          const unpack=await run('tar',['-xf',path.join(directory,download.name),'-C',extraction]);assert.equal(unpack.code,0,unpack.output);
          const entries=await fs.readdir(extraction);assert.equal(entries.length,1);const root=path.join(extraction,entries[0]);
          const manifest=JSON.parse(await fs.readFile(path.join(root,'portable-manifest.json'),'utf8'));assert.equal(manifest.commit,'10b6249d3cade77798d5a2c7f233d52c35a4ad41');
          const runtime=path.join(root,'runtime/node.exe');
          const env={SystemRoot:process.env.SystemRoot,WINDIR:process.env.WINDIR,PATH:'',TEMP:process.env.TEMP,TMP:process.env.TMP};
          const wrapper=await run(path.join(env.SystemRoot,'System32/cmd.exe'),['/d','/c','call',path.join(root,'Start Evidence Quest.cmd'),'--verify'],{cwd:extraction,env});assert.equal(wrapper.code,0,wrapper.output);assert.match(wrapper.output,/Portable package verified/);
          const origin='http://127.0.0.1:4364';let server,output='';
          async function start(){output='';server=spawn(runtime,[path.join(root,'launch.mjs'),'--no-open'],{cwd:extraction,env,windowsHide:true,stdio:['ignore','pipe','pipe']});server.stdout.on('data',x=>output+=x);server.stderr.on('data',x=>output+=x);let spawnError;server.on('error',error=>spawnError=error);const deadline=Date.now()+90000;while(!output.includes('Ready:')){if(spawnError)throw spawnError;if(server.exitCode!==null||Date.now()>deadline)throw Error('Published package did not start: '+output);await new Promise(resolve=>setTimeout(resolve,100));}}
          async function stop(){if(server&&server.exitCode===null){const closed=once(server,'close');server.kill();await closed;}server=undefined;}
          let browser,page;
          try{
           await start();assert.equal((await fetch(origin+'/healthz')).ok,true);
           const config=await (await fetch(origin+'/api/garden/config')).json();assert.equal(config.textFeedback,false);assert.equal(config.readingFeedback,false);
           assert.equal((await (await fetch(origin+'/api/config')).json()).liveAvailable,false);
           browser=await chromium.launch({channel:'chromium'});
           const context=await browser.newContext({viewport:{width:1366,height:768},serviceWorkers:'block'});const external=[],errors=[];
           await context.route('**/*',route=>{const url=route.request().url();if(url.startsWith(origin+'/'))return route.continue();external.push(url);return route.abort();});
           page=await context.newPage();page.on('pageerror',error=>errors.push(error.message));
           await page.goto(origin+'/garden');await page.getByRole('button',{name:'Begin Pip’s adventure',exact:true}).click();
           const startButton=page.getByRole('button',{name:'Start playing',exact:true});await startButton.waitFor({timeout:60000});
           const scene=page.locator('.garden-scene');await expect(scene).toHaveAttribute('data-scene-phase','ready',{timeout:90000});
           await expect.poll(async()=>JSON.parse(await scene.getAttribute('data-character-assets')??'{}').pending,{timeout:90000}).toBe(0);
           await startButton.click();const transitionAt=Date.now();await expect(scene).toHaveAttribute('data-scene-phase','ready',{timeout:90000});
           await expect.poll(async()=>JSON.parse(await scene.getAttribute('data-character-assets')??'{}').pending,{timeout:90000}).toBe(0);const sceneReadyMs=Date.now()-transitionAt;
           const audio=await page.evaluate(async()=>{const manifest=await (await fetch('/audio/cast/manifest.json')).json();const bytes=await (await fetch(manifest.entries.find(x=>x.text.length>25).clip.uri)).arrayBuffer();const audio=new AudioContext();try{const decoded=await audio.decodeAudioData(bytes);return {duration:decoded.duration,samples:decoded.length};}finally{await audio.close();}});assert.ok(audio.duration>0&&audio.samples>0);
           await page.screenshot({path:path.join(directory,'published-windows-startup.png')});assert.deepEqual(external,[]);assert.deepEqual(errors,[]);
           await context.close();await stop();await start();assert.equal((await fetch(origin+'/healthz')).ok,true);await stop();
           const guest=await browser.newContext();assert.deepEqual(await guest.cookies(),[]);const releasePage=await guest.newPage();
           const releaseResponse=await releasePage.goto('https://github.com/TonyG-FWE/evidence-quest/releases/tag/demo-10b6249d3cad');assert.equal(releaseResponse.status(),200);
           await expect(releasePage.getByRole('link',{name:'Sign in',exact:true}).first()).toBeVisible();
           await releasePage.screenshot({path:path.join(directory,'signed-out-release.png'),fullPage:true});await guest.close();
           const result={verificationHost:'Fresh windows-2022 GitHub-hosted runner',status:'PASS',at:new Date().toISOString(),archive:download.name,sha256:download.sha256,commit:manifest.commit,extraction,checks:['Fresh public release archive extracted into a path containing spaces.','Windows launcher independently verifies files using the bundled Node with no Node on PATH.','Authored server starts with no credentials on the fixed loopback origin.','Fresh Chromium renders the supplied village and enters ordinary play.','An included recorded voice decodes successfully.','All non-loopback browser network requests blocked; zero external requests or page errors.','Owned server stops and restarts successfully.','Release page returns HTTP 200 in an empty browser context and displays Sign in.'],audio,sceneReadyMs,limitations:['Existing full Windows journey and four-platform native qualification records are retained; this run verifies the published download and startup.','This publication check does not add human microphone or broad device/performance acceptance.']};
           await fs.writeFile(path.join(directory,'windows-startup.json'),JSON.stringify(result,null,2)+'\n');console.log(JSON.stringify(result));
          }catch(error){await page?.screenshot({path:path.join(directory,'windows-startup-failure.png')}).catch(()=>{});await fs.writeFile(path.join(directory,'windows-startup-failure.json'),JSON.stringify({at:new Date().toISOString(),error:error.stack,serverOutput:output},null,2)+'\n');throw error;}finally{await browser?.close();await stop();}
          '@ | Set-Content -LiteralPath verify-windows.mjs
          node verify-windows.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Published Windows verification failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: published-download-verification
          if-no-files-found: error
          path: |
            .tmp/player-download-publication/*.json
            .tmp/player-download-publication/*.sha256
            .tmp/player-download-publication/*.png
