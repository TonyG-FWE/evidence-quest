8" rx="12" fill="url(#paper)" stroke="#D4C6A8" stroke-width="1" /><text x="286" y="331" font-size="29" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">One little boat carries the seed safely, but it cannot carry Pip.</text><text x="286" y="377" font-size="29" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">When the boats are joined side by side, their wide tops make a</text><text x="286" y="423" font-size="29" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">bridge Pip can walk across. The seed stays dark in a boat or a</text><text x="286" y="469" font-size="29" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">hand. Its lantern-flower grows only after its roots reach the hill’s</text><text x="286" y="515" font-size="29" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">soil.</text><g data-design-control="{&quot;label&quot;: &quot;Enlarge source&quot;, &quot;kind&quot;: &quot;secondary&quot;, &quot;width&quot;: 172, &quot;height&quot;: 50, &quot;textSize&quot;: 20, &quot;focus&quot;: false, &quot;fits&quot;: true}"><rect x="267" y="668" width="172" height="50" rx="12" fill="#FFFEFA" stroke="#18324B" stroke-width="1.6" /><text x="353.0" y="700.0" font-size="20" fill="#18324B" font-weight="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Enlarge source</text></g><g data-design-control="{&quot;label&quot;: &quot;Select a detail&quot;, &quot;kind&quot;: &quot;secondary&quot;, &quot;width&quot;: 165, &quot;height&quot;: 50, &quot;textSize&quot;: 20, &quot;focus&quot;: false, &quot;fits&quot;: true}"><rect x="451" y="668" width="165" height="50" rx="12" fill="#FFFEFA" stroke="#18324B" stroke-width="1.6" /><text x="533.5" y="700.0" font-size="20" fill="#18324B" font-weight="700" text-anchor="middle" font-family="Segoe UI, Arial,