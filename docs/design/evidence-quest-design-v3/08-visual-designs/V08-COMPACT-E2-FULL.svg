e-linecap="round" stroke-linejoin="round" /><rect x="-43" y="-96" width="86" height="84" rx="20" fill="url(#paper)" stroke="#18324B" stroke-width="3" /><path d="M-42 -42q42 12 84 0v13q0 17 -19 17h-49q-17 0 -16 -16Z" fill="#24858C" stroke="#18324B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="7" cy="-66" r="25" fill="#18324B" stroke="#607A88" stroke-width="4"/><circle cx="7" cy="-66" r="17" fill="#254762" stroke="none" stroke-width="1"/><circle cx="13" cy="-73" r="6" fill="#FFFEFA" stroke="none" stroke-width="1"/><ellipse cx="-31" cy="-67" rx="5" ry="9" fill="#E9725C" /><rect x="-30" y="-18" width="16" height="21" rx="7" fill="#18324B" stroke="none" stroke-width="1" /><rect x="17" y="-18" width="16" height="21" rx="7" fill="#18324B" stroke="none" stroke-width="1" /></g></g><text x="20" y="296" font-size="32" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Loop is on a low</text><text x="20" y="348" font-size="32" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">wheeled crew cart in</text><text x="20" y="400" font-size="32" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">the courtyard.</text><rect x="20" y="465" width="342" height="70" rx="14" fill="#FFFEFA" stroke="#18324B" stroke-width="1.8" /><text x="38" y="505" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Play recording</text><rect x="20" y="553" width="342" height="70" rx="14" fill="#F3C65C" stroke="#18324B" stroke-width="1.8" /><text x="38" y="593" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Frame 1</text><rect x="20" y="641" width="342" height="70" rx="14" fill="#FFFEFA" stroke="#18324B" stroke-width="1.8" /><text x="38" y="681" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Frame 2</text><rect x="20" y="729" width="342" height="70" rx="14" fill="#FFFEFA" stroke="#18324B" stroke-width="1.8" /><text x="38" y="769" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Frame 3</text><rect x="20" y="817" width="342" height="70" rx="14" fill="#FFFEFA" stroke="#18324B" stroke-width="1.8" /><text x="38" y="857" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Next frame</text><rect x="20" y="905" width="342" height="70" rx="14" fill="#ECF1F3" stroke="#18324B" stroke-width="1.8" /><text x="38" y="945" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Previous frame</text><text x="20" y="1028" font-size="30" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">This is the first frame.</text><rect x="20" y="1106" width="342" height="70" rx="14" fill="#FFFEFA" stroke="#18324B" stroke-width="1.8" /><text x="38" y="1146" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Describe recording</text><rect x="20" y="1194" width="342" height="70" rx="14" fill="#FFFEFA" stroke="#18324B" stroke-width="1.8" /><text x="38" y="1234" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Photo</text><text x="20" y="1324" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Remy’s message</text><text x="20" y="1390.0" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">I saw Loop go</text><text x="20" y="1457.5" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">through the crew</text><text x="20" y="1525.0" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">door. Then I saw</text><text x="20" y="1592.5" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">‘CANCELED’ at the</text><text x="20" y="1660.0" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">courtyard. I think our</text><text x="20" y="1727.5" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">whole premiere is</text><text x="20" y="1795.0" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">off.</text></g><rect x="0" y="2038" width="390" height="100" rx="0" fill="#FFF9E9" stroke="none" stroke-width="1" /><rect x="20" y="2053" width="350" height="70" rx="14" fill="#FFFEFA" stroke="#18324B" stroke-width="1.8" /><text x="38" y="2093" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Return to room</text></svg>