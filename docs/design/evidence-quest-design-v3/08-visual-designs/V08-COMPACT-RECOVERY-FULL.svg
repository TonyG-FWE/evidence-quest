</defs><rect x="0" y="0" width="390" height="1153" rx="0" fill="#FFF9E9" stroke="none" stroke-width="1" /><text x="20" y="46" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Paused</text><g data-design-control="{&quot;label&quot;: &quot;Close&quot;, &quot;kind&quot;: &quot;secondary&quot;, &quot;width&quot;: 104, &quot;height&quot;: 58, &quot;textSize&quot;: 30, &quot;focus&quot;: false, &quot;fits&quot;: true}"><rect x="267" y="20" width="104" height="58" rx="12" fill="#FFFEFA" stroke="#18324B" stroke-width="1.6" /><text x="319.0" y="59.5" font-size="30" fill="#18324B" font-weight="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Close</text></g><path d="M18 118H371" fill="none" stroke="#ADC3C7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(0 136)"><text x="20" y="46" font-size="34" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Progress can’t be</text><text x="20" y="102" font-size="34" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">saved on this device.</text><text x="20" y="229.0" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">You can keep</text><text x="20" y="296.5" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">playing during this</text><text x="20" y="364.0" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">visit. If you close or</text><text x="20" y="431.5" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">reload the page,</text><text x="20" y="499.0" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">progress that hasn’t</text><text x="20" y="566.5" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">been saved may be</text><text x="20" y="634.0" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">lost.</text><rect x="20" y="728.5" width="342" height="70" rx="14" fill="#FFFEFA" stroke="#18324B" stroke-width="1.8" /><text x="38" y="768.5" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Try saving again</text><rect x="20" y="820.5" width="342" height="70" rx="14" fill="#FFFEFA" stroke="#18324B" stroke-width="1.8" /><text x="38" y="860.5" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Keep playing</text></g><rect x="0" y="1053" width="390" height="100" rx="0" fill="#FFF9E9" stroke="none" stroke-width="1" /><rect x="20" y="1068" width="350" height="70" rx="14" fill="#FFFEFA" stroke="#18324B" stroke-width="1.8" /><text x="38" y="1108" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Return to room</text></svg>