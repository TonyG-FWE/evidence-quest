<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="1507" viewBox="0 0 390 1507"><title>Remy’s model note</title><defs>
<linearGradient id="wall" x2="0" y2="1"><stop stop-color="#F7EAD8"/><stop offset="1" stop-color="#EAD6C5"/></linearGradient>
<linearGradient id="floor" x2="0.8" y2="1"><stop stop-color="#EACBAB"/><stop offset="1" stop-color="#F5DCC1"/></linearGradient>
<linearGradient id="paper" x2="0.4" y2="1"><stop stop-color="#FFFEFA"/><stop offset="1" stop-color="#FFF3D3"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#FFF2A8" stop-opacity=".62"/><stop offset="1" stop-color="#FFF2A8" stop-opacity="0"/></radialGradient>
<pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M1 1h.08M4 4h.06" stroke="#18324B" opacity=".08" stroke-width=".1"/></pattern>
</defs><rect x="0" y="0" width="390" height="1507" rx="0" fill="#FFF9E9" stroke="none" stroke-width="1" /><text x="20" y="46" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Remy’s model</text><text x="20" y="86" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">note</text><g data-design-control="{&quot;label&quot;: &quot;Close&quot;, &quot;kind&quot;: &quot;secondary&quot;, &quot;width&quot;: 104, &quot;height&quot;: 58, &quot;textSize&quot;: 30, &quot;focus&quot;: false, &quot;fits&quot;: true}"><rect x="267" y="20" width="104" height="58" rx="12" fill="#FFFEFA" stroke="#18324B" stroke-width="1.6" /><text x="319.0" y="59.5" font-size="30" fill="#18324B" font-weight="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Close</text></g><path d="M18 118H371" fill="none" stroke="#ADC3C7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(0 136)"><text x="20" y="42" font-size="30" fill="#425B6D" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">By Remy</text><text x="20" y="114.0" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">One little boat</text><text x="20" y="181.5" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">carries the seed</text><text x="20" y="249.0" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">safely, but it cannot</text><text x="20" y="316.5" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">carry Pip. When the</text><text x="20" y="384.0" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">boats are joined side</text><text x="20" y="451.5" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">by side, their wide</text><text x="20" y="519.0" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">tops make a bridge</text><text x="20" y="586.5" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Pip can walk across.</text><text x="20" y="654.0" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">The seed stays dark</text><text x="20" y="721.5" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">in a boat or a hand.</text><text x="20" y="789.0" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Its lantern-flower</text><text x="20" y="856.5" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">grows only after its</text><text x="20" y="924.0" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">roots reach the hill’s</text><text x="20" y="991.5" font-size="36" fill="#18324B" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">soil.</text><rect x="20" y="1087.0" width="342" height="70" rx="14" fill="#FFFEFA" stroke="#18324B" stroke-width="1.8" /><text x="38" y="1127.0" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Select a detail</text><rect x="20" y="1177.0" width="342" height="70" rx="14" fill="#FFFEFA" stroke="#18324B" stroke-width="1.8" /><text x="38" y="1217.0" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Enlarge source</text></g><rect x="0" y="1407" width="390" height="100" rx="0" fill="#FFF9E9" stroke="none" stroke-width="1" /><rect x="20" y="1422" width="350" height="70" rx="14" fill="#FFFEFA" stroke="#18324B" stroke-width="1.8" /><text x="38" y="1462" font-size="30" fill="#18324B" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Return to room</text></svg>